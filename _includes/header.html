<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Daniel Magal — início">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" width="58" height="40" alt="" class="brand-mark">
      <span class="brand-text">
        <span class="brand-name">Daniel</span>
        <span class="brand-name">Magal</span>
      </span>
    </a>
    <div class="header-actions">
      {% include cta-substack.html class="btn-header" %}
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
    <nav id="site-nav" class="site-nav" aria-label="Principal">
      <a class="nav-substack" href="{{ site.substack_subscribe | default: 'https://danielmagal.substack.com/subscribe' }}" rel="noopener">Se inscreva</a>
      <a href="{{ '/sobre/' | relative_url }}"{% if page.url == '/sobre/' %} aria-current="page"{% endif %}>Sobre</a>
      <a href="{{ '/mentoria/' | relative_url }}"{% if page.url == '/mentoria/' %} aria-current="page"{% endif %}>Mentoria</a>
      <a href="{{ '/discursivas/' | relative_url }}"{% if page.url == '/discursivas/' %} aria-current="page"{% endif %}>Curso de Discursivas</a>
      <a href="{{ '/escritos/' | relative_url }}"{% if page.url == '/escritos/' %} aria-current="page"{% endif %}>Escritos</a>
      <a href="{{ '/contato/' | relative_url }}"{% if page.url == '/contato/' %} aria-current="page"{% endif %}>Contato</a>
    </nav>
  </div>
</header>
